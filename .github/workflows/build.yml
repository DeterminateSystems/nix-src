on:
  workflow_call:
    inputs:
      flake:
        required: false
        default: "./packaging/secure-packages"
        type: string
      system:
        required: true
        type: string
      runner:
        required: true
        type: string
      runner_for_virt:
        required: true
        type: string
      runner_small:
        required: true
        type: string
      if:
        required: false
        default: true
        type: boolean
      run_tests:
        required: false
        default: true
        type: boolean
      run_vm_tests:
        required: false
        default: false
        type: boolean
      run_regression_tests:
        required: false
        default: false
        type: boolean
      publish_manual:
        required: false
        default: false
        type: boolean
      upload_artifacts:
        required: false
        default: true
        type: boolean
    secrets:
      manual_netlify_auth_token:
        required: false
      manual_netlify_site_id:
        required: false
      sentry_auth_token:
        required: false
      sentry_org:
        required: false
      sentry_project:
        required: false

permissions:
  id-token: "write"
  contents: "read"

env:
  FLAKE_REF: ${{ inputs.flake }}
  SYSTEM: ${{ inputs.system }}

jobs:
  build:
    if: ${{ inputs.if }}
    strategy:
      fail-fast: false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build "$FLAKE_REF#packages.$SYSTEM.default" ".#packages.$SYSTEM.binaryTarball" --no-link -L
      - run: nix build "$FLAKE_REF#packages.$SYSTEM.binaryTarball" --out-link tarball
      - run: nix build "$FLAKE_REF#^debug,out"
      - name: Upload debug info to Sentry
        run: ./maintainers/upload-debug-info-to-sentry.py --debug-dir ./result-debug ./result/bin/nix
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.upload_artifacts
        with:
          name: ${{ inputs.system }}
          path: ./tarball/*.xz

  build_static:
    if: ${{ inputs.if }}
    strategy:
      fail-fast: false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build "$FLAKE_REF#packages.$SYSTEM.nix-cli-static" --no-link -L

  test:
    if: ${{ inputs.if && inputs.run_tests}}
    needs: build
    strategy:
      fail-fast: false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix flake check --keep-going "$FLAKE_REF" -L --system "$SYSTEM"

  # Run and test the new build system.
  nix_make:
    if: ${{ inputs.if && inputs.run_tests }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = wasm-builtin
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build ./packaging/nix-make#release.functional-tests -L

  vm_tests_smoke:
    if: inputs.run_vm_tests && github.event_name != 'merge_group'
    needs: build
    runs-on: ${{ inputs.runner_for_virt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: |
          nix build -L \
            "$FLAKE_REF#hydraJobs.tests.functional_user" \
            "$FLAKE_REF#hydraJobs.tests.githubFlakes" \
            "$FLAKE_REF#hydraJobs.tests.nix-docker" \
            "$FLAKE_REF#hydraJobs.tests.tarballFlakes" \
            ;

  vm_tests_all:
    if: inputs.run_vm_tests && github.event_name == 'merge_group'
    needs: build
    runs-on: ${{ inputs.runner_for_virt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: |
          tests=$(nix flake show --json \
            | jq -r --arg flake "$FLAKE_REF" '
              .inventory.hydraJobs.output.children.tests.children
              | with_entries(select(.value | has("derivation")))
              | keys[]
              | $flake + "#hydraJobs.tests." + .')

          if [ -z "$tests" ]; then
            echo "error: no tests found in hydraJobs.tests"
            exit 1
          fi

          cmd() {
            nix build -L --keep-going --timeout 600 $tests
          }

          if ! cmd; then
            echo "failed, retrying once ..."
            printf "\n\n\n\n\n\n\n\n"
            cmd
          fi

  flake_regressions:
    if: |
      (inputs.run_regression_tests && github.event_name == 'merge_group')
      || (
      inputs.run_regression_tests
        && github.event.pull_request.head.repo.full_name == 'DeterminateSystems/nix-src'
        && (
          (github.event.action == 'labeled' && github.event.label.name == 'flake-regression-test')
          || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'flake-regression-test'))
        )
      )
    needs: build
    runs-on: ${{ inputs.runner }}
    strategy:
      matrix:
        nix_config:
          - "lazy-trees = true"
          - "lazy-trees = false"
          - "eval-cores = 24"
        # Each group takes roughly 10 minutes.
        glob:
          - "[0-9a-d]*"
          - "[e-k]*"
          - "[l]*"
          - "[m]*"
          - "[n]*"
          - "[o-z]*"

    steps:
      - name: Checkout nix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout flake-regressions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NixOS/flake-regressions
          path: flake-regressions
          persist-credentials: false
      - name: Checkout flake-regressions-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NixOS/flake-regressions-data
          path: flake-regressions/tests
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          # The installer enables parallel evaluation by default; only the
          # `eval-cores = 24` configuration should use it.
          extra-conf: |
            extra-experimental-features = provenance
            eval-cores = 1
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Run flake regression tests
        id: run
        env:
          #PARALLEL: ${{ !contains(matrix.nix_config, 'eval-cores') && '-P 50%' || '-P 1' }}
          PARALLEL: '-P 1'
          FLAKE_REGRESSION_GLOB: ${{ matrix.glob }}
          NIX_CONFIG: ${{ matrix.nix_config }}
          PREFETCH: "1"
          USE_NIX_FLAKE_SHOW: "1"
        run: |
          set -x
          echo "PARALLEL: $PARALLEL"
          echo "NIX_CONFIG: $NIX_CONFIG"
          if [ ! -z "${NSC_CACHE_PATH:-}" ]; then
            mkdir -p "${NSC_CACHE_PATH}/nix/xdg-cache"
            export XDG_CACHE_HOME="${NSC_CACHE_PATH}/nix/xdg-cache"
          fi
          nix build "$FLAKE_REF" -L --out-link ./new-nix
          export PATH=$(pwd)/new-nix/bin:$PATH
          [[ $(type -p nix) = $(pwd)/new-nix/bin/nix ]]

          nix config show lazy-trees
          nix config show eval-cores
          lscpu
          nproc

          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nix"
          du -sh "$cache_dir"/* || true
          find "$cache_dir/tarball-cache-v2/objects/pack" -name '*.pack' | wc -l || true

          if ! flake-regressions/eval-all.sh; then
            echo "Some failed, trying again"
            printf "\n\n\n\n\n\n\n\n"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            NIX_REMOTE=/tmp/nix flake-regressions/eval-all.sh
          fi
      - name: Collect flake regression statistics
        env:
          NIX_CONFIG_UNDER_TEST: ${{ matrix.nix_config }}
          FLAKE_REGRESSION_GLOB: ${{ matrix.glob }}
          RETRIED: ${{ steps.run.outputs.retried }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          ./maintainers/flake-regression-stats.py collect \
            --tests-dir flake-regressions/tests \
            --nix-config "$NIX_CONFIG_UNDER_TEST" \
            --glob "$FLAKE_REGRESSION_GLOB" \
            ${RETRIED:+--retried} \
            --output "flake-regression-stats-$JOB_INDEX.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # Artifact names cannot contain the '*' in the glob, so use the job index.
          name: flake-regression-stats-${{ inputs.system }}-${{ strategy.job-index }}
          path: flake-regression-stats-${{ strategy.job-index }}.json

  flake_regressions_stats:
    needs: flake_regressions
    if: needs.flake_regressions.result == 'success'
    runs-on: ${{ inputs.runner_small }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flake-regression-stats-${{ inputs.system }}-*
          path: flake-regression-stats
          merge-multiple: true
      - name: Aggregate flake regression statistics
        run: |
          ./maintainers/flake-regression-stats.py aggregate \
            --input-dir flake-regression-stats \
            --output "flake-regression-stats-$SYSTEM.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flake-regression-stats-${{ inputs.system }}
          path: flake-regression-stats-${{ inputs.system }}.json

  manual:
    if: github.event_name != 'merge_group'
    needs: build
    runs-on: ${{ inputs.runner_small }}
    permissions:
      id-token: "write"
      contents: "read"
      pull-requests: "write"
      statuses: "write"
      deployments: "write"
    steps:
      - name: Checkout nix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build manual
        if: inputs.system == 'x86_64-linux'
        run: nix build "$FLAKE_REF#hydraJobs.manual"
      - uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        if: inputs.publish_manual && inputs.system == 'x86_64-linux'
        with:
          publish-dir: "./result/share/doc/nix/manual"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          # NOTE(cole-h): We have a perpetual PR displaying our changes against upstream open, but
          # its conversation is locked, so this PR comment can never be posted.
          # https://github.com/DeterminateSystems/nix-src/pull/165
          enable-pull-request-comment: ${{ github.event.pull_request.number != 165 }}
          enable-commit-comment: true
          enable-commit-status: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.manual_netlify_auth_token }}
          NETLIFY_SITE_ID: ${{ secrets.manual_netlify_site_id }}

  success:
    needs:
      - build
      - test
      - vm_tests_smoke
      - vm_tests_all
      - flake_regressions
      - manual
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"
      - run: |
          echo "A dependent in the build matrix failed:"
          echo "$needs"
          exit 1
        env:
          needs: ${{ toJSON(needs) }}
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
